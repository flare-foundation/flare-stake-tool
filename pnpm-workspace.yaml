minimumReleaseAge: 10080
trustPolicy: no-downgrade
trustPolicyExclude:
  - '@reduxjs/toolkit@2.8.2'
  - 'chokidar@4.0.3'
  - 'reselect@5.1.1'
  - 'semver@6.3.1'
  - 'undici-types@6.19.8'
# trustPolicy: no-downgrade forces full packuments for every lockfile entry;
# pnpm's 60s default is too tight for the 10 MB ones on CI runners.
fetchTimeout: 300000
overrides:
  # Security floors for transitive dependencies (pnpm audit). Every range is bounded at the
  # next major: an open floor such as '>=1.1.21' is also satisfied by 5.x, and pnpm prefers
  # versions already in the lockfile, so unbounded floors silently cross majors.
  '@ledgerhq/cryptoassets': '>=13.33.0 <14'
  axios: '>=1.20.0 <2'
  'brace-expansion@1': '>=1.1.21 <2'
  'brace-expansion@2': '>=2.1.7 <3'
  'brace-expansion@5': '>=5.0.12 <6'
  follow-redirects: '>=1.16.2 <2'
  'form-data@4': '>=4.0.6 <5'
  'js-yaml@4': '>=4.3.2 <5'
  '@humanfs/node': '>=0.16.8 <1'
  # 7.1.3 (low-severity XSS fix) is younger than minimumReleaseAge; the high/moderate fixes are in 7.0.5
  serialize-javascript: '>=7.0.5 <8'
  'uuid@11': '>=11.1.1 <12'
  'ws@8': '>=8.21.0 <9'
allowBuilds:
  esbuild: true
  keccak: true
  node-hid: true
  node-pty: true
  usb: true
