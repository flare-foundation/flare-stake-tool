stages:
  - test
  - sbom

default:
  tags:
    - flarenetwork
  artifacts:
    expire_in: 3 days

# Pipeline strategy:
# * MRs and branch pushes → lint/typecheck/test
# * Tag push → same jobs run as a gate; the actual npm publish + attestation
#   happens from GitHub (see .github/workflows/release.yaml).
# Integration tests are run locally only (see CONTRIBUTING.md).

include:
  - component: gitlab.com/flarenetwork/ci-components-private/lgtm@2
  - component: gitlab.com/flarenetwork/ci-components-private/dependency-track@2
  - template: Jobs/Secret-Detection.latest.gitlab-ci.yml
  - component: gitlab.com/flarenetwork/ci-components-private/lint-shell@2
  - component: gitlab.com/flarenetwork/ci-components-private/lint-pnpm@2
    inputs:
      node_version: '24.19'
      tags: [flarenetwork-md]
      before_script_additional: |
        apt-get update && apt-get install -y --no-install-recommends python3 make g++
      lint_commands: |
        pnpm lint:check
        pnpm format:check
        pnpm typecheck
  - component: gitlab.com/flarenetwork/ci-components-private/test-pnpm@2
    inputs:
      node_version: '24.19'
      tags: [flarenetwork-md]
      before_script_additional: |
        apt-get update && apt-get install -y --no-install-recommends python3 make g++
      test_commands: |
        pnpm test:coverage
